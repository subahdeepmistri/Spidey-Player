<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#06b6d4" />
    <meta name="description"
        content="Spidey Player — a local-first, privacy-respecting music player. Import local audio, keep your library in the browser, and watch the beat." />
    <title>Spidey Player 2.0</title>

    <!-- PWA Manifest -->
    <link rel="manifest" href="manifest.json" />

    <!-- Icons for various platforms -->
    <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="icon" href="icons/icon-512.png" sizes="512x512" type="image/png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/icon-192.png" />
    <link rel="mask-icon" href="icons/icon-192.png" color="#06b6d4" />

    <!-- Apple PWA meta tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Spidey Player" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Microsoft PWA -->
    <meta name="msapplication-TileColor" content="#06b6d4" />
    <meta name="msapplication-TileImage" content="icons/icon-144.png" />

    <!-- Tailwind is compiled to a static file by `npm run build:css`.
         The CDN runtime build is deliberately not used: it cannot be cached
         for production and logs a warning on every page load. -->
    <link rel="stylesheet" href="dist/tailwind.css" />
    <link rel="stylesheet" href="style.css" />

    <!-- Service Worker Registration -->
        <script>
          if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
              navigator.serviceWorker.register('sw.js')
                .then(reg => {
                  console.log('[SW] Registered:', reg.scope);
                  // Check for updates periodically
                  setInterval(() => reg.update(), 1000 * 60 * 60); // hourly
                })
                .catch(err => console.warn('[SW] Registration failed:', err));
            });
          }
        </script>
    </head>

    <body class="text-gray-100 min-h-screen flex items-start md:items-center justify-center p-4">
        <!-- PWA Splash Screen -->
        <div id="pwa-splash" aria-hidden="true">
          <div class="spinner" aria-hidden="true"></div>
          <p>Loading Spidey Player…</p>
        </div>

        <!-- iOS Install Banner -->
        <div class="ios-install-banner" id="ios-install-banner" role="dialog" aria-label="Install Spidey Player">
          <div class="banner-content">
            <div class="banner-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
              </svg>
            </div>
            <div class="banner-text">
              <strong>Install Spidey Player</strong>
              Tap <strong>Share</strong> → <strong>Add to Home Screen</strong>
            </div>
            <button class="banner-close" id="ios-banner-close" aria-label="Dismiss">Not now</button>
          </div>
        </div>

        <a class="skip-link" href="#main-content">Skip to main content</a>

    <!-- Animated Background -->
    <div class="bg-animate" aria-hidden="true">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
    </div>

    <!-- Visualizer Canvas -->
    <canvas id="visualizer" aria-hidden="true"></canvas>

    <div class="relative w-full max-w-5xl flex flex-col md:flex-row gap-6 items-start justify-center z-10">

        <!-- Main Player Card -->
        <main class="glass w-full max-w-md rounded-3xl p-6 sm:p-8 relative transition-all duration-300 hover:scale-[1.01]" id="main-content" tabindex="-1">
            <div class="flex flex-col items-center relative z-20">
                            <h1 class="sr-only">Spidey Player</h1>
                            <!-- Header -->
                            <div class="w-full flex justify-between items-center mb-6 text-gray-300">
                    <button type="button" id="pwa-install-btn" class="pwa-install-btn" hidden>Install</button>
                                        <div class="text-xs uppercase tracking-widest font-semibold text-blue-300">Now Playing</div>
                                        <button id="playlist-toggle-btn" class="icon-btn" aria-label="Show playlist"
                                            aria-expanded="false" aria-controls="playlist-panel">
                                            <span class="icon-placeholder" data-icon="list"></span>
                                        </button>
                                    </div>

                <!-- Album Art -->
                <div class="relative w-56 h-56 sm:w-64 sm:h-64 mb-6 group shrink-0">
                    <div class="absolute inset-0 bg-blue-500 rounded-full blur-2xl opacity-20 group-hover:opacity-40 transition-opacity"
                        aria-hidden="true"></div>
                    <!-- The idle CSS pulse lives on this wrapper; the beat-reactive
                         scale is written to #album-art. Keeping them on separate
                         elements stops the CSS animation from overriding the JS
                         transform. -->
                    <div class="art-pulse w-full h-full rounded-full" id="art-pulse">
                        <img src="image/862eb376cc18fd124f045f6b31b0dc4b.jpg" alt="" id="album-art"
                            class="w-full h-full object-cover rounded-full shadow-2xl border-4 border-white/5 relative z-10" />
                    </div>
                </div>

                <!-- Song Info -->
                <div class="text-center mb-6 w-full">
                    <h2 class="text-xl sm:text-2xl font-bold mb-1 text-white tracking-wide truncate" id="song-title">
                        Select a Track
                    </h2>
                    <p class="text-blue-400 text-sm font-medium tracking-wider truncate" id="song-artist">Spidey Player</p>
                    <p class="text-gray-500 text-xs tracking-wider truncate mt-1" id="song-album"></p>
                </div>

                <!-- Progress -->
                <div class="w-full mb-5">
                    <div id="progress-container" class="progress-track group" role="slider" tabindex="0"
                        aria-label="Seek position" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0"
                        aria-valuetext="Not loaded">
                        <div id="progress-bar" class="progress-fill" style="width: 0%">
                            <span class="progress-thumb" aria-hidden="true"></span>
                        </div>
                    </div>
                    <div class="flex justify-between text-xs text-gray-400 font-mono mt-2">
                        <span id="current-time">0:00</span>
                        <span id="duration">0:00</span>
                    </div>
                </div>

                <!-- Volume -->
                                <div class="flex items-center gap-3 w-full mb-5 px-1">
                                    <button id="mute-btn" class="icon-btn" aria-label="Mute" aria-pressed="false">
                                        <span class="icon-placeholder" data-icon="volume-high"></span>
                                    </button>
                                    <input id="volume" class="volume-slider" type="range" min="0" max="1" step="0.01" value="1"
                                        aria-label="Volume" />
                                </div>

                                <!-- Controls -->
                                <div class="flex items-center justify-between w-full px-2">
                                    <button id="shuffle-btn" class="icon-btn" aria-label="Shuffle" aria-pressed="false">
                                        <span class="icon-placeholder" data-icon="random"></span>
                                    </button>

                                    <button id="prev-btn" class="transport-btn" aria-label="Previous track">
                                        <span class="icon-placeholder" data-icon="step-backward"></span>
                                    </button>

                                    <button id="play-btn" class="play-btn" aria-label="Play">
                                        <span class="icon-placeholder" data-icon="play"></span>
                                    </button>

                                    <button id="next-btn" class="transport-btn" aria-label="Next track">
                                        <span class="icon-placeholder" data-icon="step-forward"></span>
                                    </button>

                                    <button id="repeat-btn" class="icon-btn" aria-label="Repeat off" aria-pressed="false">
                                        <span class="icon-placeholder" data-icon="redo"></span>
                                    </button>
                                </div>
            </div>
        </main>

        <h2 id="playlist-heading" class="sr-only">Playlist</h2>
        <!-- Backdrop MUST live in this z-10 wrapper with the panel. If it is a
             sibling of the wrapper (z-40 vs wrapper z-10) it paints ON TOP of
             the playlist and frosts the text. -->
        <div id="panel-backdrop" class="panel-backdrop" aria-hidden="true"></div>
        <section id="playlist-panel" class="glass-panel panel" aria-labelledby="playlist-heading">
            <div class="flex flex-col gap-3 mb-4">
                <div class="flex justify-between items-center gap-2">
                    <div class="flex items-center gap-2">
                                            <button type="button" id="import-btn" class="btn-chip">
                                                <span class="icon-placeholder" data-icon="plus" style="width: 1em; height: 1em; display: inline-flex; margin-right: 0.25rem;"></span> Import
                                            </button>
                                            <input type="file" id="file-input" accept="audio/*,.mp3,.flac,.m4a,.wav,.ogg,.opus"
                                                multiple class="sr-only" />
                                            <button id="panel-close-btn" class="icon-btn" aria-label="Close playlist">
                                                <span class="icon-placeholder" data-icon="xmark"></span>
                                            </button>
                                        </div>
                </div>

                <div class="relative">
                                    <label class="sr-only" for="search-input">Search songs</label>
                                    <span class="icon-placeholder absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs" data-icon="search" style="width: 0.75rem; height: 0.75rem;"></span>
                                    <input type="text" id="search-input" placeholder="Search songs..."
                                        class="w-full bg-white/5 border border-white/10 rounded-lg py-2 pl-8 pr-3 text-sm text-gray-200 placeholder-gray-500 focus:outline-none focus:border-cyan-500/50 transition-colors" />
                                </div>

                <div class="flex items-center justify-between text-[11px] text-gray-400 font-mono">
                    <span id="track-count">0 tracks</span>
                    <span id="storage-usage"></span>
                </div>
            </div>

            <ul id="playlist" class="space-y-1 overflow-y-auto flex-1 min-h-0 pr-2 custom-scrollbar"></ul>

            <p id="import-status" class="text-[11px] text-cyan-300/80 mt-2 min-h-[1rem]" aria-live="polite"></p>
        </section>
    </div>

    <!-- Toast host -->
    <div id="toasts" class="toast-host" role="status" aria-live="polite" aria-atomic="false"></div>

    <!-- Screen-reader announcement channel -->
        <p id="sr-status" class="sr-only" aria-live="polite"></p>

        <!-- Drop overlay -->
        <div id="drop-overlay" class="drop-overlay" aria-hidden="true">
            <div class="drop-overlay-inner">
                <span class="icon-placeholder" data-icon="file-arrow-down" style="width: 2.5rem; height: 2.5rem;"></span>
                <p>Drop audio files to add them</p>
            </div>
        </div>

        <script src="id3.js"></script>
        <script src="db.js"></script>
        <script src="app.js"></script>
    </body>

    </html>
